/* 全局手機基礎設定 */
html, body {
    width: 100%;
    margin: 0;

/* 行動裝置優化媒體查詢 (螢幕寬度 768px 以下) */
@media screen and (max-width: 768px) {
    body {
        padding: 12px; /* 邊界留白，避免文字貼邊 */

    /* 容器自適應寬度 */

        max-width: 100% !important;
        box-sizing: border-box;

    input, select, button {

        min-height: 44px; /* 符合觸控按鈕最佳尺寸 */
        font-size: 16px;
        margin-bottom: 10px;
        box-sizing: border-box;
        border-radius: 8px; /* 圓角更符合現代手機風格 */

    }

    /* 表格自適應滾動（若有使用表格） */
    table {
        display: block;
        width: 100%;
        overflow-x: auto;
        white-space: nowrap;
    }
}

<script>
function initDate() {
    const now = new Date();
    const yearType = document.getElementById('yearType').value;
    const fullYear = now.getFullYear();
    
    document.getElementById('year').value = yearType === 'roc' ? fullYear - 1911 : fullYear;
    document.getElementById('month').value = now.getMonth() + 1;
    document.getElementById('day').value = now.getDate();
    
    updateDays();
}

function toggleYearType() {
    const yearInput = document.getElementById('year');
    const yearType = document.getElementById('yearType').value;
    let currentYear = parseInt(yearInput.value);
    
    if (!isNaN(currentYear)) {
        if (yearType === 'roc' && currentYear > 1000) {
            yearInput.value = currentYear - 1911;
        } else if (yearType === 'ad' && currentYear < 1000) {
            yearInput.value = currentYear + 1911;
        }
    }
    updateDays();
}

function updateDays() {
    const yearType = document.getElementById('yearType').value;
    let inputYear = parseInt(document.getElementById('year').value) || 2026;
    let month = parseInt(document.getElementById('month').value) || 1;
    const dayInput = document.getElementById('day');

    if (month < 1) month = 1;
    if (month > 12) month = 12;
    document.getElementById('month').value = month;

    let adYear = (yearType === 'roc') ? (inputYear + 1911) : inputYear;
    let maxDays = new Date(adYear, month, 0).getDate();
    
    dayInput.max = maxDays;
    if (parseInt(dayInput.value) > maxDays) {
        dayInput.value = maxDays;
    }
}

window.onload = initDate;
</script>

            4: { branch: "亥水", kin: "子孫", text: "九四：商兌未寧，介疾有喜。" },
            5: { branch: "酉金", kin: "兄弟", text: "九五：孚于剝，有厲。" },
            6: { branch: "未土", kin: "父母", text: "上六：引兌。" }
        }
    },
    "2-6": {
        name: "澤水困", palace: "兌宮 (屬金)",
        yaoData: {
            1: { branch: "寅木", kin: "妻財", text: "初六：臀困于株木，入于幽谷，三歲不覿。" },
            2: { branch: "辰土", kin: "父母", text: "九二：困于酒食，朱紱方來，利用享祀，征凶，無咎。" },
            3: { branch: "午火", kin: "官鬼", text: "六三：困于石，據于蒺藜，入于其宮，不見其妻，凶。" },
            4: { branch: "亥水", kin: "子孫", text: "九四：來徐徐，困于金車，吝，有終。" },
            5: { branch: "酉金", kin: "兄弟", text: "九五：劓刖，困于赤紱，乃徐有說，利用祭祀。" },
            6: { branch: "未土", kin: "父母", text: "上六：困于葛藟，于臲卼，曰動悔。有悔，征吉。" }
        }
    },
    "2-8": {
        name: "澤地萃", palace: "兌宮 (屬金)",
        yaoData: {
            1: { branch: "未土", kin: "父母", text: "初六：有孚不終，乃亂乃萃，若號，一握為笑，勿恤，往無咎。" },
            2: { branch: "巳火", kin: "官鬼", text: "六二：引吉，無咎，孚乃利用禴。" },
            3: { branch: "卯木", kin: "妻財", text: "六三：萃如，嗟如，無攸利，往無咎，小吝。" },
            4: { branch: "亥水", kin: "子孫", text: "九四：大吉，無咎。" },
            5: { branch: "酉金", kin: "兄弟", text: "九五：萃有位，無咎。匪孚，元永貞，悔亡。" },
            6: { branch: "未土", kin: "父母", text: "上六：齎咨涕洟，無咎。" }
        }
    },
    "2-7": {
        name: "澤山咸", palace: "兌宮 (屬金)",
        yaoData: {
            1: { branch: "辰土", kin: "父母", text: "初六：咸其拇。" },
            2: { branch: "午火", kin: "官鬼", text: "六二：咸其腓，凶，居吉。" },
            3: { branch: "申金", kin: "兄弟", text: "九三：咸其股，執其隨，往吝。" },
            4: { branch: "亥水", kin: "子孫", text: "九四：貞吉悔亡，憧憧往來，朋從爾思。" },
            5: { branch: "酉金", kin: "兄弟", text: "九五：咸其脢，無悔。" },
            6: { branch: "未土", kin: "父母", text: "上六：咸其輔，頰，舌。" }
        }
    },
    "8-7": {
        name: "地山謙", palace: "兌宮 (屬金)",
        yaoData: {
            1: { branch: "辰土", kin: "父母", text: "初六：謙謙君子，用涉大川，吉。" },
            2: { branch: "午火", kin: "官鬼", text: "六二：鳴謙，貞吉。" },
            3: { branch: "申金", kin: "兄弟", text: "九三：勞謙，君子有終，吉。" },
            4: { branch: "丑土", kin: "父母", text: "六四：無不利，撝謙。" },
            5: { branch: "亥水", kin: "子孫", text: "六五：不富以其鄰，利用侵伐，無不利。" },
            6: { branch: "酉金", kin: "兄弟", text: "上六：鳴謙，利用行師，征邑國。" }
        }
    },
    "4-7": {
        name: "雷山小過", palace: "兌宮 (屬金)",
        yaoData: {
            1: { branch: "辰土", kin: "父母", text: "初六：飛鳥以凶。" },
            2: { branch: "午火", kin: "官鬼", text: "六二：過其祖，遇其妣；不及其君，遇其臣，無咎。" },
            3: { branch: "申金", kin: "兄弟", text: "九三：弗過防之，從或戕之，凶。" },
            4: { branch: "午火", kin: "官鬼", text: "九四：無咎，弗過遇之。往厲必戒，勿用永貞。" },
            5: { branch: "申金", kin: "兄弟", text: "六五：密雲不雨，自我西郊，公弋取彼在穴。" },
            6: { branch: "戌土", kin: "父母", text: "上六：弗遇過之，飛鳥離之，凶，是謂災眚。" }
        }
    },
    "4-2": {
        name: "雷澤歸妹", palace: "兌宮 (屬金)",
        yaoData: {
            1: { branch: "巳火", kin: "官鬼", text: "初九：歸妹以娣，跛能履，征吉。" },
            2: { branch: "卯木", kin: "妻財", text: "九二：眇能視，利幽人之貞。" },
            3: { branch: "丑土", kin: "父母", text: "六三：歸妹以須，反歸以娣。" },
            4: { branch: "午火", kin: "官鬼", text: "九四：歸妹愆期，遲歸有時。" },
            5: { branch: "申金", kin: "兄弟", text: "六五：帝乙歸妹，其君之袂，不如其娣之袂良，月幾望，吉。" },
            6: { branch: "戌土", kin: "父母", text: "上六：女承筐無實，士刲羊無血，無攸利。" }
        }
    },
    "3-3": {
        name: "離為火", palace: "離宮 (屬火)",
        yaoData: {
            1: { branch: "卯木", kin: "父母", text: "初九：履錯然，敬之無咎。" },
            2: { branch: "丑土", kin: "子孫", text: "六二：黃離，元吉。" },
            3: { branch: "亥水", kin: "官鬼", text: "九三：日昃之離，不鼓缶而歌，則大耋之嗟，凶。" },
            4: { branch: "酉金", kin: "妻財", text: "九四：突如其來如，焚如，死如，棄如。" },
            5: { branch: "未土", kin: "子孫", text: "六五：出涕沱若，戚嗟若，吉。" },
            6: { branch: "巳火", kin: "兄弟", text: "上九：王用出征，有嘉折首，獲匪其醜，無咎。" }
        }
    },
    "3-7": {
        name: "火山旅", palace: "離宮 (屬火)",
        yaoData: {
            1: { branch: "辰土", kin: "子孫", text: "初六：旅瑣瑣，斯其所取災。" },
            2: { branch: "午火", kin: "兄弟", text: "六二：旅即次，懷其資，得童僕貞。" },
            3: { branch: "申金", kin: "妻財", text: "九三：旅焚其次，喪其童僕，貞厲。" },
            4: { branch: "酉金", kin: "妻財", text: "九四：旅于處，得其資斧，我心不快。" },
            5: { branch: "未土", kin: "子孫", text: "六五：射雉一矢亡，終以譽命。" },
            6: { branch: "巳火", kin: "兄弟", text: "上九：鳥焚其巢，旅人先笑後號咷。喪牛于易，凶。" }
        }
    },
    "3-4": {
        name: "火雷噬嗑", palace: "離宮 (屬火)",
        yaoData: {
            1: { branch: "子水", kin: "官鬼", text: "初九：屨校滅趾，無咎。" },
            2: { branch: "寅木", kin: "父母", text: "六二：噬膚滅鼻，無咎。" },
            3: { branch: "辰土", kin: "子孫", text: "六三：噬臘肉，遇毒，小吝，無咎。" },
            4: { branch: "酉金", kin: "妻財", text: "九四：噬乾胏，得金矢，利艱貞，吉。" },
            5: { branch: "未土", kin: "子孫", text: "六五：噬乾肉，得黃金，貞厲，無咎。" },
            6: { branch: "巳火", kin: "兄弟", text: "上九：何校滅耳，凶。" }
        }
    },
    "7-4": {
        name: "山雷頤", palace: "離宮 (屬火)",
        yaoData: {
            1: { branch: "子水", kin: "官鬼", text: "初九：舍爾靈龜，觀我朵頤，凶。" },
            2: { branch: "寅木", kin: "父母", text: "六二：顛頤，拂經，于丘頤，征凶。" },
            3: { branch: "辰土", kin: "子孫", text: "六三：拂頤，貞凶，十年勿用，無攸利。" },
            4: { branch: "戌土", kin: "子孫", text: "六四：顛頤吉，虎視眈眈，其欲逐逐，無咎。" },
            5: { branch: "子水", kin: "官鬼", text: "六五：拂經，居貞吉，不可涉大川。" },
            6: { branch: "寅木", kin: "父母", text: "上九：由頤，厲吉，利涉大川。" }
        }
    },
    "8-4": {
        name: "地雷復", palace: "離宮 (屬火)",
        yaoData: {
            1: { branch: "子水", kin: "官鬼", text: "初九：不遠復，無祇悔，元吉。" },
            2: { branch: "寅木", kin: "父母", text: "六二：休復，吉。" },
            3: { branch: "辰土", kin: "子孫", text: "六三：頻復，厲無咎。" },
            4: { branch: "丑土", kin: "子孫", text: "六四：中行獨復。" },
            5: { branch: "亥水", kin: "官鬼", text: "六五：敦復，無悔。" },
            6: { branch: "酉金", kin: "妻財", text: "上六：迷復，凶，有災眚。用行師，終有大敗，以其國君凶，至于十年不克征。" }
        }
    },
    "2-4": {
        name: "澤雷隨", palace: "離宮 (屬火)",
        yaoData: {
            1: { branch: "子水", kin: "官鬼", text: "初九：官有渝，貞吉。出門交有功。" },
            2: { branch: "寅木", kin: "父母", text: "六二：係小子，失丈夫。" },
            3: { branch: "辰土", kin: "子孫", text: "六三：係丈夫，失小子。隨有求得，利居貞。" },
            4: { branch: "亥水", kin: "官鬼", text: "九四：隨有獲，貞凶。有孚在道，以明，何咎。" },
            5: { branch: "酉金", kin: "妻財", text: "九五：孚于嘉，吉。" },
            6: { branch: "未土", kin: "子孫", text: "上六：拘係之，乃從維之。王用亨于西山。" }
        }
    },
    "2-3": {
        name: "澤火革", palace: "離宮 (屬火)",
        yaoData: {
            1: { branch: "卯木", kin: "父母", text: "初九：鞏用黃牛之革。" },
            2: { branch: "丑土", kin: "子孫", text: "六二：己日乃革之，征吉，無咎。" },
            3: { branch: "亥水", kin: "官鬼", text: "九三：征凶，貞厲。革言三就，有孚。" },
            4: { branch: "亥水", kin: "官鬼", text: "九四：悔亡，有孚改命，吉。" },
            5: { branch: "酉金", kin: "妻財", text: "九五：大人虎變，未占有孚。" },
            6: { branch: "未土", kin: "子孫", text: "上六：君子豹變，小人革面，征凶，居貞吉。" }
        }
    },
"3-6": {
        name: "火水未濟", palace: "離宮 (屬火)",
        yaoData: {
            1: { branch: "戊寅木", kin: "父母", text: "初六：濡其尾，吝。" },
            2: { branch: "戊辰土", kin: "子孫", text: "九二：曳其輪，貞吉。" },
            3: { branch: "戊午火", kin: "兄弟", text: "六三：未濟，征凶，利涉大川。" },
            4: { branch: "壬申金", kin: "妻財", text: "九四：貞吉，悔亡，震用伐鬼方，三年有賞于大國。" },
            5: { branch: "壬戌土", kin: "子孫", text: "六五：貞吉，無悔，君子之光，有孚，吉。" },
            6: { branch: "壬子水", kin: "官鬼", text: "上九：有孚于飲酒，無咎。濡其首，有孚失是。" }
        }
    },
    "4-4": {
        name: "震為雷", palace: "震宮 (屬木)",
        yaoData: {
            1: { branch: "子水", kin: "父母", text: "初九：震來虩虩，後笑言啞啞，吉。" },
            2: { branch: "寅木", kin: "兄弟", text: "六二：震來厲，億喪貝，躋于九陵，勿逐，七日得。" },
            3: { branch: "辰土", kin: "妻財", text: "六三：震蘇蘇，震行無眚。" },
            4: { branch: "午火", kin: "子孫", text: "九四：震遂泥。" },
            5: { branch: "申金", kin: "官鬼", text: "六五：震往來厲，億無喪，有事。" },
            6: { branch: "戌土", kin: "妻財", text: "上六：震索索，視矍矍，征凶。震不于其躬，于其鄰，無咎。婚媾有言。" }
        }
    },
    "4-8": {
        name: "雷地豫", palace: "震宮 (屬木)",
        yaoData: {
            1: { branch: "未土", kin: "妻財", text: "初六：鳴豫，凶。" },
            2: { branch: "巳火", kin: "子孫", text: "六二：介于石，不終日，貞吉。" },
            3: { branch: "卯木", kin: "兄弟", text: "六三：盱豫，悔。遲有悔。" },
            4: { branch: "午火", kin: "子孫", text: "九四：由豫，大有得。勿疑，朋盍朋。" },
            5: { branch: "申金", kin: "官鬼", text: "六五：貞疾，恆不死。" },
            6: { branch: "戌土", kin: "妻財", text: "上六：冥豫，成有渝，無咎。" }
        }
    },
    "4-6": {
        name: "雷水解", palace: "震宮 (屬木)",
        yaoData: {
            1: { branch: "寅木", kin: "兄弟", text: "初六：無咎。" },
            2: { branch: "辰土", kin: "妻財", text: "九二：田獲三狐，得黃矢，貞吉。" },
            3: { branch: "午火", kin: "子孫", text: "六三：負且乘，致寇至，貞吝。" },
            4: { branch: "午火", kin: "子孫", text: "九四：解而拇，朋至斯孚。" },
            5: { branch: "申金", kin: "官鬼", text: "六五：君子維有解，吉，有孚于小人。" },
            6: { branch: "戌土", kin: "妻財", text: "上六：公用射隼于高墉之上，獲之，無不利。" }
        }
    },
    "4-5": {
        name: "雷風恆", palace: "震宮 (屬木)",
        yaoData: {
            1: { branch: "丑土", kin: "妻財", text: "初六：浚恆，貞凶，無攸利。" },
            2: { branch: "亥水", kin: "父母", text: "九二：悔亡。" },
            3: { branch: "酉金", kin: "官鬼", text: "九三：不恆其德，或承之羞，貞吝。" },
            4: { branch: "午火", kin: "子孫", text: "九四：田無禽。" },
            5: { branch: "申金", kin: "官鬼", text: "六五：恆其德，貞，婦人吉，夫子凶。" },
            6: { branch: "戌土", kin: "妻財", text: "上六：振恆，凶。" }
        }
    },
    "8-5": {
        name: "地風升", palace: "震宮 (屬木)",
        yaoData: {
            1: { branch: "丑土", kin: "妻財", text: "初六：允升，大吉。" },
            2: { branch: "亥水", kin: "父母", text: "九二：孚乃利用禴，無咎。" },
            3: { branch: "酉金", kin: "官鬼", text: "九三：升虛邑。" },
            4: { branch: "丑土", kin: "妻財", text: "六四：王用亨于岐山，吉無咎。" },
            5: { branch: "亥水", kin: "父母", text: "六五：貞吉，升階。" },
            6: { branch: "酉金", kin: "官鬼", text: "上六：冥升，利于不息之貞。" }
        }
    },
    "6-5": {
        name: "水風井", palace: "震宮 (屬木)",
        yaoData: {
            1: { branch: "丑土", kin: "妻財", text: "初六：井泥不食，舊井無禽。" },
            2: { branch: "亥水", kin: "父母", text: "九二：井谷射鮒，甕敝漏。" },
            3: { branch: "酉金", kin: "官鬼", text: "九三：井渫不食，為我心惻，可用汲，王明，並受其福。" },
            4: { branch: "申金", kin: "官鬼", text: "六四：井甃，無咎。" },
            5: { branch: "戌土", kin: "妻財", text: "九五：井冽，寒泉食。" },
            6: { branch: "子水", kin: "父母", text: "上六：井收勿幕，有孚元吉。" }
        }
    },
    "2-5": {
        name: "澤風大過", palace: "震宮 (屬木)",
        yaoData: {
            1: { branch: "丑土", kin: "妻財", text: "初六：藉用白茅，無咎。" },
            2: { branch: "亥水", kin: "父母", text: "九二：枯楊生稊，老夫得其女妻，無不利。" },
            3: { branch: "酉金", kin: "官鬼", text: "九三：棟橈，凶。" },
            4: { branch: "亥水", kin: "父母", text: "九四：棟隆，吉；有它吝。" },
            5: { branch: "酉金", kin: "官鬼", text: "九五：枯楊生華，老婦得其士夫，無咎無譽。" },
            6: { branch: "未土", kin: "妻財", text: "上六：過涉滅頂，凶，無咎。" }
        }
    },
    "1-6": {
        name: "天水訟", palace: "震宮 (屬木)",
        yaoData: {
            1: { branch: "寅木", kin: "兄弟", text: "初六：不永所事，小有言，終吉。" },
            2: { branch: "辰土", kin: "妻財", text: "九二：不克訟，歸而逋，其邑人三百戶，無眚。" },
            3: { branch: "午火", kin: "子孫", text: "六三：食舊德，貞厲，終吉。或從王事，無成。" },
            4: { branch: "午火", kin: "子孫", text: "九四：不克訟，復即命，渝安貞，吉。" },
            5: { branch: "申金", kin: "官鬼", text: "九五：訟，元吉。" },
            6: { branch: "戌土", kin: "妻財", text: "上九：或錫之鞶帶，終朝三褫之。" }
        }
    },
    "1-3": {
        name: "天火同人", palace: "震宮 (屬木)",
        yaoData: {
            1: { branch: "卯木", kin: "兄弟", text: "初九：同人于門，無咎。" },
            2: { branch: "丑土", kin: "妻財", text: "六二：同人于宗，吝。" },
            3: { branch: "亥水", kin: "父母", text: "九三：伏戎于莽，升其高陵，三歲不興。" },
            4: { branch: "午火", kin: "子孫", text: "九四：乘其墉，弗克攻，吉。" },
            5: { branch: "申金", kin: "官鬼", text: "九五：同人，先號咷而後笑，大師克相遇。" },
            6: { branch: "戌土", kin: "妻財", text: "上九：同人于郊，無悔。" }
        }
    },
    "5-5": {
        name: "巽為風", palace: "巽宮 (屬木)",
        yaoData: {
            1: { branch: "丑土", kin: "妻財", text: "初六：進退，利武人之貞。" },
            2: { branch: "亥水", kin: "父母", text: "九二：巽在床下，用史巫紛若，吉無咎。" },
            3: { branch: "酉金", kin: "官鬼", text: "九三：頻巽，吝。" },
            4: { branch: "未土", kin: "妻財", text: "六四：悔亡，田獲三品。" },
            5: { branch: "巳火", kin: "子孫", text: "九五：貞吉悔亡，無不利。無初有終，先庚三日，後庚三日，吉。" },
            6: { branch: "卯木", kin: "兄弟", text: "上九：巽在床下，喪其資斧，貞凶。" }
        }
    },
    "5-1": {
        name: "風天小畜", palace: "巽宮 (屬木)",
        yaoData: {
            1: { branch: "子水", kin: "父母", text: "初九：復自道，何其咎，吉。" },
            2: { branch: "寅木", kin: "兄弟", text: "九二：牽復，吉。" },
            3: { branch: "辰土", kin: "妻財", text: "九三：輿說輻，夫妻反目。" },
            4: { branch: "未土", kin: "妻財", text: "六四：有孚，血去惕出，無咎。" },
            5: { branch: "巳火", kin: "子孫", text: "九五：有孚攣如，富以其鄰。" },
            6: { branch: "卯木", kin: "兄弟", text: "上九：既雨既處，尚德載，婦貞厲。月幾望，君子征凶。" }
        }
    },
    "5-3": {
        name: "風火家人", palace: "巽宮 (屬木)",
        yaoData: {
            1: { branch: "卯木", kin: "兄弟", text: "初九：閑有家，悔亡。" },
            2: { branch: "丑土", kin: "妻財", text: "六二：無攸遂，在中饋，貞吉。" },
            3: { branch: "亥水", kin: "父母", text: "九三：家人嗃嗃，悔厲吉；婦子嘻嘻，終吝。" },
            4: { branch: "未土", kin: "妻財", text: "六四：富家，大吉。" },
            5: { branch: "巳火", kin: "子孫", text: "九五：王假有家，勿恤，吉。" },
            6: { branch: "卯木", kin: "兄弟", text: "上九：有孚威如，終吉。" }
        }
    },
    "5-4": {
        name: "風雷益", palace: "巽宮 (屬木)",
        yaoData: {
            1: { branch: "子水", kin: "父母", text: "初九：利用為大作，元吉，無咎。" },
            2: { branch: "寅木", kin: "兄弟", text: "六二：或益之十朋之龜，弗克違，永貞吉。王用享于帝，吉。" },
            3: { branch: "辰土", kin: "妻財", text: "六三：益之用凶事，無咎。有孚中行，告公用圭。" },
            4: { branch: "未土", kin: "妻財", text: "六四：中行，告公從。利用為依遷國。" },
            5: { branch: "巳火", kin: "子孫", text: "九五：有孚惠心，勿問元吉。有孚惠我德。" },
            6: { branch: "卯木", kin: "兄弟", text: "上九：莫益之，或擊之，立心勿恆，凶。" }
        }
    },
    "1-4": {
        name: "天雷無妄", palace: "巽宮 (屬木)",
        yaoData: {
            1: { branch: "子水", kin: "父母", text: "初九：無妄，往吉。" },
            2: { branch: "寅木", kin: "兄弟", text: "六二：不耕獲，不菑畬，則利有攸往。" },
            3: { branch: "辰土", kin: "妻財", text: "六三：無妄之災，或繫之牛，行人之得，邑人之災。" },
            4: { branch: "午火", kin: "子孫", text: "九四：可貞，無咎。" },
            5: { branch: "申金", kin: "官鬼", text: "九五：無妄之疾，勿藥有喜。" },
            6: { branch: "戌土", kin: "妻財", text: "上九：無妄，行有災，無攸利。" }
        }
    },
    "7-5": {
        name: "山風蠱", palace: "巽宮 (屬木)",
        yaoData: {
            1: { branch: "丑土", kin: "妻財", text: "初六：幹父之蠱，有子，考無咎，厲終吉。" },
            2: { branch: "亥水", kin: "父母", text: "九二：幹母之蠱，不可貞。" },
            3: { branch: "酉金", kin: "官鬼", text: "九三：幹父之蠱，小有悔，無大咎。" },
            4: { branch: "戌土", kin: "妻財", text: "六四：裕父之蠱，往見吝。" },
            5: { branch: "子水", kin: "父母", text: "六五：幹父之蠱，用譽。" },
            6: { branch: "寅木", kin: "兄弟", text: "上九：不事王侯，高尚其事。" }
        }
    },
    "7-3": {
        name: "山火賁", palace: "巽宮 (屬木)",
        yaoData: {
            1: { branch: "卯木", kin: "兄弟", text: "初九：賁其趾，舍車而徒。" },
            2: { branch: "丑土", kin: "妻財", text: "六二：賁其鬚。" },
            3: { branch: "亥水", kin: "父母", text: "九三：賁如濡如，永貞吉。" },
            4: { branch: "戌土", kin: "妻財", text: "六四：賁如皤如，白馬翰如，匪寇婚媾。" },
            5: { branch: "子水", kin: "父母", text: "六五：賁于丘園，束帛戔戔，吝，終吉。" },
            6: { branch: "寅木", kin: "兄弟", text: "上九：白賁，無咎。" }
        }
    },
    "6-6": {
        name: "坎為水", palace: "坎宮 (屬水)",
        yaoData: {
            1: { branch: "寅木", kin: "子孫", text: "初六：習坎，入于坎窞，凶。" },
            2: { branch: "辰土", kin: "官鬼", text: "九二：坎有險，求小得。" },
            3: { branch: "午火", kin: "妻財", text: "六三：來之坎坎，險且枕，入于坎窞，勿用。" },
            4: { branch: "申金", kin: "父母", text: "六四：樽酒簋貳，用缶，納約自牖，終無咎。" },
            5: { branch: "戌土", kin: "官鬼", text: "九五：坎不盈，祇既平，無咎。" },
            6: { branch: "子水", kin: "兄弟", text: "上六：繫用徽纆，寘于叢棘，三歲不得，凶。" }
        }
    },
    "6-2": {
        name: "水澤節", palace: "坎宮 (屬水)",
        yaoData: {
            1: { branch: "巳火", kin: "妻財", text: "初九：不出戶庭，無咎。" },
            2: { branch: "卯木", kin: "子孫", text: "九二：不出門庭，凶。" },
            3: { branch: "丑土", kin: "官鬼", text: "六三：不節若，則嗟若，無咎。" },
            4: { branch: "申金", kin: "父母", text: "六四：安節，亨。" },
            5: { branch: "戌土", kin: "官鬼", text: "九五：甘節，吉，往有尚。" },
            6: { branch: "子水", kin: "兄弟", text: "上六：苦節，貞凶，悔亡。" }
        }
    },
    "6-4": {
        name: "水雷屯", palace: "坎宮 (屬水)",
        yaoData: {
            1: { branch: "子水", kin: "兄弟", text: "初九：磐桓，利居貞，利建侯。" },
            2: { branch: "寅木", kin: "子孫", text: "六二：屯如邅如，乘馬班如。匪寇婚媾，女子貞不字，十年乃字。" },
            3: { branch: "辰土", kin: "官鬼", text: "六三：即鹿無虞，惟入于林中，君子幾不如舍，往吝。" },
            4: { branch: "申金", kin: "父母", text: "六四：乘馬班如，求婚媾，往吉，無不利。" },
            5: { branch: "戌土", kin: "官鬼", text: "九五：屯其膏，小貞吉，大貞凶。" },
            6: { branch: "子水", kin: "兄弟", text: "上六：乘馬班如，泣血漣漣。" }
        }
    },
    "6-3": {
        name: "水火既濟", palace: "坎宮 (屬水)",
        yaoData: {
            1: { branch: "卯木", kin: "子孫", text: "初九：曳其輪，濡其尾，無咎。" },
            2: { branch: "丑土", kin: "官鬼", text: "六二：婦喪其茀，勿逐，七日得。" },
            3: { branch: "亥水", kin: "兄弟", text: "九三：高宗伐鬼方，三年克之，小人勿用。" },
            4: { branch: "申金", kin: "父母", text: "六四：濡有衣袽，終日戒。" },
            5: { branch: "戌土", kin: "官鬼", text: "九五：東鄰殺牛，不如西鄰之禴祭，實受其福。" },
            6: { branch: "子水", kin: "兄弟", text: "上六：濡其首，厲。" }
        }
    },
    "4-3": {
        name: "雷火豐", palace: "坎宮 (屬水)",
        yaoData: {
            1: { branch: "卯木", kin: "子孫", text: "初九：遇其旬主，雖旬無咎，往有尚。" },
            2: { branch: "丑土", kin: "官鬼", text: "六二：豐其蔀，日中見斗，往得疑疾，有孚發若，吉。" },
            3: { branch: "亥水", kin: "兄弟", text: "九三：豐其沛，日中見沫，折其右肱，無咎。" },
            4: { branch: "午火", kin: "妻財", text: "九四：豐其蔀，日中見斗，遇其夷主，吉。" },
            5: { branch: "申金", kin: "父母", text: "六五：來章，有慶譽，吉。" },
            6: { branch: "戌土", kin: "官鬼", text: "上六：豐其屋，蔀其家，闚其戶，闃其無人，三歲不覿，凶。" }
        }
    },
    "8-3": {
        name: "地火明夷", palace: "坎宮 (屬水)",
        yaoData: {
            1: { branch: "卯木", kin: "子孫", text: "初九：明夷于飛，垂其翼。君子于行，三日不食，有攸往，主人有言。" },
            2: { branch: "丑土", kin: "官鬼", text: "六二：明夷，夷于左股，用拯馬壯，吉。" },
            3: { branch: "亥水", kin: "兄弟", text: "九三：明夷于南狩，得其大首，不可疾貞。" },
            4: { branch: "丑土", kin: "官鬼", text: "六四：入于左腹，獲明夷之心，于出門庭。" },
            5: { branch: "亥水", kin: "兄弟", text: "六五：箕子之明夷，利貞。" },
            6: { branch: "酉金", kin: "父母", text: "上六：不明晦，初登于天，後入于地。" }
        }
    },
    "8-6": {
        name: "地水師", palace: "坎宮 (屬水)",
        yaoData: {
            1: { branch: "寅木", kin: "子孫", text: "初六：師出以律，否臧凶。" },
            2: { branch: "辰土", kin: "官鬼", text: "九二：在師中，吉無咎，王三錫命。" },
            3: { branch: "午火", kin: "妻財", text: "六三：師或輿尸，凶。" },
            4: { branch: "丑土", kin: "官鬼", text: "六四：師左次，無咎。" },
            5: { branch: "亥水", kin: "兄弟", text: "六五：田有禽，利執言，無咎。長子帥師，弟子輿尸，貞凶。" },
            6: { branch: "酉金", kin: "父母", text: "上六：大君有命，開國承家，小人勿用。" }
        }
    },
    "6-7": {
        name: "水山蹇", palace: "坎宮 (屬水)",
        yaoData: {
            1: { branch: "辰土", kin: "官鬼", text: "初六：往蹇，來譽。" },
            2: { branch: "午火", kin: "妻財", text: "六二：王臣蹇蹇，匪躬之故。" },
            3: { branch: "申金", kin: "父母", text: "九三：往蹇，來反。" },
            4: { branch: "申金", kin: "父母", text: "六四：往蹇，來連。" },
            5: { branch: "戌土", kin: "官鬼", text: "九五：大蹇，朋來。" },
            6: { branch: "子水", kin: "兄弟", text: "上六：往蹇，來碩，吉，利見大人。" }
        }
    },
    "7-7": {
        name: "艮為山", palace: "艮宮 (屬土)",
        yaoData: {
            1: { branch: "辰土", kin: "兄弟", text: "初六：艮其趾，無咎，利永貞。" },
            2: { branch: "午火", kin: "父母", text: "六二：艮其腓，不拯其隨，其心不快。" },
            3: { branch: "申金", kin: "子孫", text: "九三：艮其限，列其夤，厲薰心。" },
            4: { branch: "戌土", kin: "兄弟", text: "六四：艮其身，無咎。" },
            5: { branch: "子水", kin: "妻財", text: "六五：艮其輔，言有序，悔亡。" },
            6: { branch: "寅木", kin: "官鬼", text: "上九：敦艮，吉。" }
        }
    },
    "7-1": {
        name: "山天大畜", palace: "艮宮 (屬土)",
        yaoData: {
            1: { branch: "子水", kin: "妻財", text: "初九：有厲，利己。" },
            2: { branch: "寅木", kin: "官鬼", text: "九二：輿說輹。" },
            3: { branch: "辰土", kin: "兄弟", text: "九三：良馬逐，利艱貞。日閑輿衛，利有攸往。" },
            4: { branch: "戌土", kin: "兄弟", text: "六四：童牛之牿，元吉。" },
            5: { branch: "子水", kin: "妻財", text: "六五：豮豕之牙，吉。" },
            6: { branch: "寅木", kin: "官鬼", text: "上九：何天之衢，亨。" }
        }
    },
    "7-2": {
        name: "山澤損", palace: "艮宮 (屬土)",
        yaoData: {
            1: { branch: "巳火", kin: "父母", text: "初九：已事湍往，無咎，酌損之。" },
            2: { branch: "卯木", kin: "官鬼", text: "九二：利貞，征凶，弗損益之。" },
            3: { branch: "丑土", kin: "兄弟", text: "六三：三人行，則損一人；一人行，則得其友。" },
            4: { branch: "戌土", kin: "兄弟", text: "六四：損其疾，使湍有喜，無咎。" },
            5: { branch: "子水", kin: "妻財", text: "六五：或益之十朋之龜，弗克違，元吉。" },
            6: { branch: "寅木", kin: "官鬼", text: "上九：弗損益之，無咎，貞吉，利有攸往，得臣無家。" }
        }
    },
    "3-2": {
        name: "火澤睽", palace: "艮宮 (屬土)",
        yaoData: {
            1: { branch: "巳火", kin: "父母", text: "初九：悔亡，喪馬勿逐，自復；見惡人，無咎。" },
            2: { branch: "卯木", kin: "官鬼", text: "九二：遇主于巷，無咎。" },
            3: { branch: "丑土", kin: "兄弟", text: "六三：見輿曳，其牛掣，其人天且劓，無初有終。" },
            4: { branch: "酉金", kin: "子孫", text: "九四：睽孤，遇元夫，交孚，厲無咎。" },
            5: { branch: "未土", kin: "兄弟", text: "六五：悔亡，厥宗噬膚，往何咎。" },
            6: { branch: "巳火", kin: "父母", text: "上九：睽孤，見豕負塗，載鬼一車，先張之弧，後說之弧，匪寇婚媾，往遇雨則吉。" }
        }
    },
    "1-2": {
        name: "天澤履", palace: "艮宮 (屬土)",
        yaoData: {
            1: { branch: "巳火", kin: "父母", text: "初九：素履，往無咎。" },
            2: { branch: "卯木", kin: "官鬼", text: "九二：履道坦坦，幽人貞吉。" },
            3: { branch: "丑土", kin: "兄弟", text: "六三：眇能視，跛能履，履虎尾，咥人，凶。武人為于大君。" },
            4: { branch: "午火", kin: "父母", text: "九四：履虎尾，愬愬，終吉。" },
            5: { branch: "申金", kin: "子孫", text: "九五：夬履，貞厲。" },
            6: { branch: "戌土", kin: "兄弟", text: "上九：視履考祥，其旋元吉。" }
        }
    },
    "5-2": {
        name: "風澤中孚", palace: "艮宮 (屬土)",
        yaoData: {
            1: { branch: "巳火", kin: "父母", text: "初九：虞吉，有它不燕。" },
            2: { branch: "卯木", kin: "官鬼", text: "九二：鳴鶴在陰，其子和之，我有好爵，吾與爾靡之。" },
            3: { branch: "丑土", kin: "兄弟", text: "六三：得敵，或鼓或罷，或泣或歌。" },
            4: { branch: "未土", kin: "兄弟", text: "六四：月幾望，馬匹亡，無咎。" },
            5: { branch: "巳火", kin: "父母", text: "九五：有孚攣如，無咎。" },
            6: { branch: "卯木", kin: "官鬼", text: "上九：翰音登于天，貞凶。" }
        }
    },
    "5-7": {
        name: "風山漸", palace: "艮宮 (屬土)",
        yaoData: {
            1: { branch: "辰土", kin: "兄弟", text: "初六：鴻漸于干，小子厲，有言，無咎。" },
            2: { branch: "午火", kin: "父母", text: "六二：鴻漸于磐，飲食衎衎，吉。" },
            3: { branch: "申金", kin: "子孫", text: "九三：鴻漸于陸，夫征不復，婦孕不育，凶；利御寇。" },
            4: { branch: "未土", kin: "兄弟", text: "六四：鴻漸于木，或得其榱，無咎。" },
            5: { branch: "巳火", kin: "父母", text: "九五：鴻漸于陵，婦三歲不孕，終莫之勝，吉。" },
            6: { branch: "卯木", kin: "官鬼", text: "上九：鴻漸于陸，其羽可用為儀，吉。" }
        }
    },
    "7-6": {
        name: "山水蒙", palace: "艮宮 (屬土)",
        yaoData: {
            1: { branch: "寅木", kin: "官鬼", text: "初六：發蒙，利用刑人，用說桎梏，以往吝。" },
            2: { branch: "辰土", kin: "兄弟", text: "九二：包蒙吉，納婦吉，子克家。" },
            3: { branch: "午火", kin: "父母", text: "六三：勿用取女，見金夫，不有躬，無攸利。" },

function getGuaNameByBits(bits) {
    for (let name in guaBits) {
        let b = guaBits[name];
        if (b[0] === bits[0] && b[1] === bits[1] && b[2] === bits[2]) return name;
    }
    return '乾';
}

function getDayStemBranch(year, month, day) {
    const stems = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
    const branches = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
    let a = Math.floor((14 - month) / 12);
    let y = year + 4800 - a;
    let m = month + 12 * a - 3;
    let jd = day + Math.floor((153 * m + 2) / 5) + 365 * y + Math.floor(y / 4) - Math.floor(y / 100) + Math.floor(y / 400) - 32045;
    
    let stemIdx = (jd + 9) % 10;
    let branchIdx = (jd + 1) % 12;
    return { stem: stems[stemIdx], branch: branches[branchIdx] };
}

function getSixSpirits(dayStem) {
    const spirits = ['青龍', '朱雀', '勾陳', '騰蛇', '白虎', '玄武'];
    let offset = 0;
    if (['甲','乙'].includes(dayStem)) offset = 0;
    else if (['丙','丁'].includes(dayStem)) offset = 1;
    else if (dayStem === '戊') offset = 2;
    else if (dayStem === '己') offset = 3;
    else if (['庚','辛'].includes(dayStem)) offset = 4;
    else if (['壬','癸'].includes(dayStem)) offset = 5;

    let res = [];
    for (let i = 0; i < 6; i++) {
        res.push(spirits[(offset + i) % 6]);
    }
    return res;
}

function getKongWang(stem, branch) {
    const stems = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
    const branches = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
    let sIdx = stems.indexOf(stem);
    let bIdx = branches.indexOf(branch);
    let startBranchIdx = (bIdx - sIdx + 12) % 12;
    let kw1 = branches[(startBranchIdx + 10) % 12];
    let kw2 = branches[(startBranchIdx + 11) % 12];
    return [kw1, kw2];
}

function getGuiRen(stem) {
    const map = {
        '甲': ['丑','未'], '乙': ['子','申'], '丙': ['亥','酉'], '丁': ['亥','酉'],
        '戊': ['丑','未'], '己': ['子','申'], '庚': ['丑','未'], '辛': ['寅','午'],
        '壬': ['卯','巳'], '癸': ['卯','巳']
    };
    return map[stem] || [];
}

function getKinship(palaceElement, branch) {
    let cleanBranch = branch ? branch.substring(0, 1) : '';
    let bElement = branchElements[cleanBranch];
    if (!bElement) return "";
    if (palaceElement === bElement) return "兄弟";
    if (elementRelation[palaceElement].sheng === bElement) return "子孫";
    if (elementRelation[bElement].sheng === palaceElement) return "父母";
    if (elementRelation[palaceElement].ke === bElement) return "妻財";
    if (elementRelation[bElement].ke === palaceElement) return "官鬼";
    return "";
}

function judgeBranchRelation(mBranch, cBranch) {
    let mEl = branchElements[mBranch];
    let cEl = branchElements[cBranch];
    if (!mEl || !cEl) return { detail: "無動變爻生剋資訊" };
    if (mEl === cEl) return { detail: `動爻【${mBranch}】與變爻【${cBranch}】五行相同（比和）。` };
    if (elementRelation[mEl].sheng === cEl) return { detail: `動爻【${mBranch}${mEl}】生變爻【${cBranch}${cEl}】（化進/化洩）。` };
    if (elementRelation[cEl].sheng === mEl) return { detail: `變爻【${cBranch}${cEl}】回頭生動爻【${mBranch}${mEl}】（大吉）。` };
    if (elementRelation[mEl].ke === cEl) return { detail: `動爻【${mBranch}${mEl}】剋變爻【${cBranch}${cEl}】。` };
    if (elementRelation[cEl].ke === mEl) return { detail: `變爻【${cBranch}${cEl}】回頭剋動爻【${mBranch}${mEl}】（受制）。` };
    return { detail: "" };
}

function analyzeShiYing(sBranch, yBranch) {
    let sEl = branchElements[sBranch] || '金';
    let yEl = branchElements[yBranch] || '金';
    let rel = "比和";
    let desc = "世應五行相同，雙方勢均力敵，合作平穩。";

    if (elementRelation[sEl] && elementRelation[sEl].ke === yEl) {
        rel = "世剋應"; desc = "世爻剋應爻，主我方佔據主導優勢。";
    } else if (elementRelation[yEl] && elementRelation[yEl].ke === sEl) {
        rel = "應剋世"; desc = "應爻剋世爻，主對方壓力較大，事態不利。";
    } else if (elementRelation[sEl] && elementRelation[sEl].sheng === yEl) {
        rel = "世生應"; desc = "世爻生應爻，主我方付出較多。";
    } else if (elementRelation[yEl] && elementRelation[yEl].sheng === sEl) {
        rel = "應生世"; desc = "應爻生世爻，主得貴人相助。";
    }
    return { relation: rel, desc: desc, shiEl: sEl, yingEl: yEl };
}

function calculateGua() {
    const yearType = document.getElementById('yearType').value;
    let inputYear = parseInt(document.getElementById('year').value);
    const month = parseInt(document.getElementById('month').value);
    const day = parseInt(document.getElementById('day').value);

    const n1 = parseInt(document.getElementById('num1').value);
    const n2 = parseInt(document.getElementById('num2').value);
    const n3 = parseInt(document.getElementById('num3').value);

    if (!inputYear || !month || !day || isNaN(n1) || isNaN(n2) || isNaN(n3)) { 
        alert('請完整輸入日期與三個數字！'); return; 
    }

    let adYear = (yearType === 'roc') ? (inputYear + 1911) : inputYear;
    const dayGanzhi = getDayStemBranch(adYear, month, day);
    const dayStem = dayGanzhi.stem;
    const dayBranch = dayGanzhi.branch;

    let lowerIndex = n1 % 8 === 0 ? 8 : n1 % 8;
    let upperIndex = n2 % 8 === 0 ? 8 : n2 % 8;
    let changeIndex = n3 % 6 === 0 ? 6 : n3 % 6;

    let upperGuaName = baguaNames[upperIndex];
    let lowerGuaName = baguaNames[lowerIndex];
    let dbKey = `${upperIndex}-${lowerIndex}`;

    let spirits = getSixSpirits(dayStem);
    let kongWang = getKongWang(dayStem, dayBranch);
    let guiRen = getGuiRen(dayStem);
    let sy = shiYingDB[dbKey] || { shi: 6, ying: 3, type: "普通卦" };

    let guaData = hexagramsDB[dbKey];
    const resultDiv = document.getElementById('result');

    if (!guaData || !guaData.yaoData) {
        resultDiv.innerHTML = `<h3 style="text-align:center; color:#d9534f;">卦象【${upperGuaName}上${lowerGuaName}下】（代碼 ${dbKey}）尚未錄入完整資料庫！</h3>`;
        resultDiv.style.display = 'block';
        document.getElementById('resultBox').style.display = 'none';
        return;
    }

    currentHexagram = {
        yaoData: guaData.yaoData,
        shiYaoPos: sy.shi
    };

    let upperBits = [...guaBits[upperGuaName]];
    let lowerBits = [...guaBits[lowerGuaName]];
    let allBits = [...upperBits, ...lowerBits];

    let tableRows = '';
    let shiBranch = '', yingBranch = '';
    let movingBranch = '';

    let changedBits = [...allBits];
    let changedBitIdx = 6 - changeIndex;
    changedBits[changedBitIdx] = changedBits[changedBitIdx] === 1 ? 0 : 1;

    let changedUpperName = getGuaNameByBits([changedBits[0], changedBits[1], changedBits[2]]);
    let changedLowerName = getGuaNameByBits([changedBits[3], changedBits[4], changedBits[5]]);

    let changeBranch = (changeIndex <= 3) 
        ? guaNajia[changedLowerName].inner[changeIndex - 1] 
        : guaNajia[changedUpperName].outer[changeIndex - 4];

    let palaceEl = guaData.palace.match(/屬(.)/)?.[1] || '金';
    let changeKin = changeBranch ? getKinship(palaceEl, changeBranch) : '';

    for (let i = 6; i >= 1; i--) {
        let yao = guaData.yaoData[i];
        if (!yao) continue;

        let isChange = (i === changeIndex);
        let rowClass = isChange ? 'class="active-yao"' : '';
        let spirit = spirits[i - 1];

        let bitVal = allBits[6 - i];
        let mainYaoSymbol = (bitVal === 1) ? `<span class="yang">━━━</span>` : `<span class="yin">━ ━</span>`;
        
        let changeYaoSymbol = '', changeBranchText = '', changeKinText = '';
        if (isChange) {
            movingBranch = yao.branch.substring(0, 1);
            changeYaoSymbol = (bitVal === 1) ? `<span class="yin">━ ━</span>` : `<span class="yang">━━━</span>`;
            changeBranchText = changeBranch ? `${changeBranch} (${branchElements[changeBranch] || ''})` : '';
            changeKinText = changeKin;
        }

        let tags = [];
        let cleanBranch = yao.branch.substring(0, 1);
        if (i === sy.shi) { tags.push('<span class="badge-shi">世</span>'); shiBranch = cleanBranch; }
        else if (i === sy.ying) { tags.push('<span class="badge-ying">應</span>'); yingBranch = cleanBranch; }

        if (kongWang.includes(cleanBranch)) tags.push('<span class="badge-kong">空</span>');
        if (guiRen.includes(cleanBranch)) tags.push('<span class="badge-gui">貴</span>');

        tableRows += `
            <tr ${rowClass}>
                <td><strong>${changeKinText}</strong></td>
                <td><strong>${changeBranchText}</strong></td>
                <td class="yao-symbol">${changeYaoSymbol}</td>
                <td>${tags.join(' ')}</td>
                <td class="yao-symbol">${mainYaoSymbol}</td>
                <td>${yao.branch}</td>
                <td>${yao.kin}</td>
                <td>${spirit}</td>
                <td style="text-align:left;">${yao.text}</td>
            </tr>
        `;
    }

    let syAnalysis = analyzeShiYing(shiBranch, yingBranch);
    let branchRel = judgeBranchRelation(movingBranch, changeBranch);
    let displayYearText = (yearType === 'roc') ? `民國 ${inputYear} 年` : `西元 ${inputYear} 年`;

    const categorySelect = document.getElementById('category');
    const selectedCategoryText = categorySelect.options[categorySelect.selectedIndex].text;

    resultDiv.innerHTML = `
        <div class="gua-title">【${guaData.name}】</div>
        <div class="gua-desc">
            問事項目：<strong>${selectedCategoryText}</strong><br>
            日期：<strong>${displayYearText} ${month} 月 ${day} 日</strong>（日干支：<strong>${dayStem}${dayBranch} 日</strong>）<br>
            旬空：<strong>${kongWang.join('、')}</strong> ｜ 貴人：<strong>${guiRen.join('、')}</strong><br>
            卦象：上${upperGuaName} 下${lowerGuaName} ｜ 宮位：${guaData.palace} ｜ 卦型：${sy.type}
        </div>
        <table>
            <tr>
                <th>變爻六親</th><th>變爻地支</th><th>變爻</th><th>世應</th><th>本卦爻象</th><th>地支</th><th>六親</th><th>六神</th><th>爻辭</th>
            </tr>
            ${tableRows}
        </table>

        <div class="analysis-card">
            <div class="section-title">一、世應局勢分析（${syAnalysis.relation}）</div>
            • <strong>局勢解析：</strong> ${syAnalysis.desc}

            <div class="section-title">二、動爻與變爻生剋</div>
            • <strong>生剋關係：</strong> ${branchRel.detail}
        </div>
    `;
    resultDiv.style.display = 'block';

    analyzeHexagram();
}

function analyzeHexagram() {
    if (!currentHexagram) return;

    const category = document.getElementById('category').value;
    
    const kinMap = {
        career: { kin: "官鬼", name: "官鬼爻" },
        wealth: { kin: "妻財", name: "妻財爻" },
        love_m: { kin: "妻財", name: "妻財爻" },
        love_f: { kin: "官鬼", name: "官鬼爻" },
        health: { kin: "子孫", name: "子孫爻" },
        fortune: { kin: "世爻", name: "世爻自身" }
    };

    const target = kinMap[category];
    const { yaoData, shiYaoPos } = currentHexagram;

    let rating = "";
    let text = "";
    let isGood = false;

    if (category === "fortune") {
        const shiKin = yaoData[shiYaoPos].kin;
        rating = "大吉";
        text = `世爻為「${shiKin}」，自身能量充沛。全卦乾健有力，代表個人運勢強旺，主動積極則無往不利。`;
        isGood = true;
    } else {
        let targetYaoList = [];
        Object.keys(yaoData).forEach(level => {
            if (yaoData[level].kin === target.kin) {
                targetYaoList.push(Number(level));
            }
        });

        if (targetYaoList.length === 0) {
            rating = "平 / 偏凶";
            text = `卦中未見「${target.name}」（用神伏藏），代表當前機緣未到或缺乏關鍵條件，所求之事阻礙較多。`;
        } else if (targetYaoList.includes(shiYaoPos)) {
            rating = "大吉";
            text = `「${target.name}」臨世爻！代表關鍵因素掌握在自己手中，所求之事順理成章，大吉之象。`;
            isGood = true;
        } else {
            rating = "中平 / 小吉";
            text = `卦中有「${target.name}」顯現，代表客觀環境存在機會，但仍需視個人努力與進一步行動而定。`;
            isGood = true;
        }
    }

    const resultBox = document.getElementById('resultBox');
    const ratingSpan = document.getElementById('resultRating');
    
    ratingSpan.textContent = rating;
    document.getElementById('targetKin').textContent = target.name;
    document.getElementById('analysisText').textContent = text;

    resultBox.className = `result-box ${isGood ? 'status-吉' : 'status-凶'}`;
    resultBox.style.display = 'block';
}
</script>
